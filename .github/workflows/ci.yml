name: CI
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build-test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select latest installed Xcode
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode*.app; do
            if [[ -d "$candidate" ]]; then xcode_app="$candidate"; fi
          done
          if [[ -n "$xcode_app" ]]; then sudo xcode-select -s "$xcode_app"; fi
          xcodebuild -version
          swift --version
      # The fixture corpus is fetched cold from Wikimedia Commons otherwise;
      # download-fixtures.sh skips files already on disk, so a cache hit turns
      # the download step into a no-op. Keyed on the manifest so an edit to the
      # track list re-fetches.
      - name: Cache audio fixtures
        uses: actions/cache@v4
        with:
          path: Tests/Fixtures/audio
          key: fixtures-${{ hashFiles('Tests/Fixtures/fixtures.json') }}
          restore-keys: fixtures-
      # SwiftPM build products, dominated by the vendored C libraries (libFLAC,
      # libopus, libebur128, …) which change rarely. The exact key includes a
      # source hash; the restore-keys fall back to the newest partial cache so
      # an ordinary commit still reuses most object files.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
            spm-${{ runner.os }}-
      - name: Download real audio fixtures
        run: |
          expected_fixture_count="$(python3 -c 'import json; print(len(json.load(open("Tests/Fixtures/fixtures.json"))["tracks"]))')"
          for attempt in 1 2 3; do
            ./scripts/download-fixtures.sh
            fixture_count="$(find Tests/Fixtures/audio -type f ! -name '.gitkeep' | wc -l | tr -d ' ')"
            if [[ "$fixture_count" -eq "$expected_fixture_count" ]]; then exit 0; fi
            echo "Only $fixture_count/$expected_fixture_count fixtures are present; retrying in 90 seconds (attempt $attempt/3)."
            sleep 90
          done
          echo "::error::The complete $expected_fixture_count-fixture corpus was not downloaded"
          exit 1
      - name: Build
        run: swift build -c release -v
      - name: Unit tests (synthetic and real fixtures)
        # Release build: the debug scalar-FFT path in TempoEstimator makes the
        # real-fixture analysis suite take ~1h45m on CI runners (see
        # current_status.md); in release the full suite is minutes. Debug
        # compilation is still covered by the iOS/watchOS xcodebuild jobs.
        run: swift test -c release -v
      - name: Validate repository scripts and whitespace
        run: |
          bash -n scripts/setup-linux.sh
          git diff --check
      - name: SPDX copyleft guard
        run: |
          if grep -R -n -E "GNU (Lesser )?General Public License|GPL-2|GPL-3|LGPL|AGPL" \
               --include="LICENSE*" --include="*.md" Sources NOTICE.md 2>/dev/null; then
            echo "::error::Copyleft license text found in dependency tree"; exit 1
          fi
          echo "No copyleft licenses detected."
      - name: Build native CMake targets
        run: |
          cmake -S . -B build-native -DPARSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel
      - name: Test native CMake targets
        run: ctest --test-dir build-native --output-on-failure

  build-native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository scripts and whitespace
        run: |
          bash -n scripts/setup-linux.sh
          git diff --check
      - name: Build native CMake targets
        run: |
          cmake -S . -B build-native -DPARSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel
      - name: Test native CMake targets
        run: ctest --test-dir build-native --output-on-failure
      - name: Install Windows GNU cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ninja-build mingw-w64
      - name: Cross-build Windows GNU shared library
        run: |
          cmake -S . -B build-windows-cross -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/windows-mingw-x86_64.cmake \
            -DPARSO_BUILD_TESTS=OFF \
            -DPARSO_BUILD_SHARED_API=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-windows-cross --parallel
          test -f build-windows-cross/libparso.dll || test -f build-windows-cross/parso.dll
          file build-windows-cross/libparso.dll 2>/dev/null || file build-windows-cross/parso.dll
      - name: Set up .NET for Windows-targeted C# compilation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build C# binding on Linux
        run: dotnet build Bindings/ParsoAudioSharp/ParsoAudioSharp.csproj --configuration Release --warnaserror
      - name: Cross-compile C# native consumer on Linux
        run: dotnet build Bindings/ParsoAudioSharp.Consumer/ParsoAudioSharp.Consumer.csproj --configuration Release --warnaserror

  build-native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native CMake targets
        shell: pwsh
        run: |
          cmake -S . -B build-native `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DPARSO_BUILD_TESTS=ON
      - name: Build native CMake targets
        run: cmake --build build-native --config Release --parallel
      - name: Test native CMake targets
        run: ctest --test-dir build-native -C Release --output-on-failure
      - name: Set up .NET for native C# consumer
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build C# native consumer
        run: dotnet build Bindings/ParsoAudioSharp.Consumer/ParsoAudioSharp.Consumer.csproj --configuration Release
      - name: Run C# native consumer
        shell: pwsh
        run: |
          $env:PATH = "$pwd\build-native\Release;$env:PATH"
          dotnet run --project Bindings/ParsoAudioSharp.Consumer/ParsoAudioSharp.Consumer.csproj --configuration Release --no-build

  build-watchos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select latest installed Xcode
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode*.app; do
            if [[ -d "$candidate" ]]; then xcode_app="$candidate"; fi
          done
          if [[ -n "$xcode_app" ]]; then sudo xcode-select -s "$xcode_app"; fi
          xcodebuild -version
      - name: Build for watchOS Simulator
        run: |
          xcodebuild -scheme parso-audio-engine-Package \
            -destination 'generic/platform=watchOS Simulator' \
            -skipPackagePluginValidation build

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select latest installed Xcode
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode*.app; do
            if [[ -d "$candidate" ]]; then xcode_app="$candidate"; fi
          done
          if [[ -n "$xcode_app" ]]; then sudo xcode-select -s "$xcode_app"; fi
          xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild -scheme parso-audio-engine-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation build
      - name: Cache acceptance-tool build
        uses: actions/cache@v4
        with:
          path: Tools/AcceptanceArtifacts/.build
          key: spm-accept-${{ runner.os }}-${{ hashFiles('Tools/AcceptanceArtifacts/**') }}
          restore-keys: spm-accept-${{ runner.os }}-
      - name: Build the acceptance tool
        run: swift build --package-path Tools/AcceptanceArtifacts
