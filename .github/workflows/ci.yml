name: CI
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build-test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select latest installed Xcode
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode*.app; do
            if [[ -d "$candidate" ]]; then xcode_app="$candidate"; fi
          done
          if [[ -n "$xcode_app" ]]; then sudo xcode-select -s "$xcode_app"; fi
          xcodebuild -version
          swift --version
      # The fixture corpus is fetched cold from Wikimedia Commons otherwise;
      # download-fixtures.sh skips files already on disk, so a cache hit turns
      # the download step into a no-op. Keyed on the manifest so an edit to the
      # track list re-fetches.
      - name: Cache audio fixtures
        uses: actions/cache@v4
        with:
          path: Tests/Fixtures/audio
          key: fixtures-${{ hashFiles('Tests/Fixtures/fixtures.json') }}
          restore-keys: fixtures-
      # SwiftPM build products, dominated by the vendored C libraries (libFLAC,
      # libopus, libebur128, …) which change rarely. The exact key includes a
      # source hash; the restore-keys fall back to the newest partial cache so
      # an ordinary commit still reuses most object files.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
            spm-${{ runner.os }}-
      - name: Download real audio fixtures
        run: |
          expected_fixture_count="$(python3 -c 'import json; print(len(json.load(open("Tests/Fixtures/fixtures.json"))["tracks"]))')"
          for attempt in 1 2 3; do
            ./scripts/download-fixtures.sh
            fixture_count="$(find Tests/Fixtures/audio -type f ! -name '.gitkeep' | wc -l | tr -d ' ')"
            if [[ "$fixture_count" -eq "$expected_fixture_count" ]]; then exit 0; fi
            echo "Only $fixture_count/$expected_fixture_count fixtures are present; retrying in 90 seconds (attempt $attempt/3)."
            sleep 90
          done
          echo "::error::The complete $expected_fixture_count-fixture corpus was not downloaded"
          exit 1
      - name: Build with warnings as errors
        run: swift build -c release -v -Xswiftc -warnings-as-errors
      - name: Unit tests (synthetic and real fixtures)
        # Release build: the debug scalar-FFT path in TempoEstimator makes the
        # real-fixture analysis suite take ~1h45m on CI runners (see
        # current_status.md); in release the full suite is minutes. Debug
        # compilation is still covered by the iOS/watchOS xcodebuild jobs.
        run: swift test -c release -v -Xswiftc -warnings-as-errors
      - name: Validate repository scripts and whitespace
        run: |
          bash -n scripts/setup-linux.sh
          git diff --check
      - name: SPDX copyleft guard
        run: |
          if grep -R -n -E "GNU (Lesser )?General Public License|GPL-2|GPL-3|LGPL|AGPL" \
               --include="LICENSE*" --include="*.md" Sources NOTICE.md 2>/dev/null; then
            echo "::error::Copyleft license text found in dependency tree"; exit 1
          fi
          echo "No copyleft licenses detected."
      - name: Build native CMake targets
        run: |
          cmake -S . -B build-native -DPARSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel
      - name: Test native CMake targets
        run: ctest --test-dir build-native --output-on-failure
      - name: Set up Swift for portable Linux smoke
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build and run portable Swift smoke with warnings as errors
        run: |
          swiftc -swift-version 6 -warnings-as-errors -parse-as-library \
            Sources/ParsoAudioStreaming/ByteRangeMap.swift \
            Sources/ParsoAudioStreaming/CachePolicies.swift \
            Sources/ParsoAudioStreaming/RemoteStreamingResponsePolicy.swift \
            Sources/ParsoAudioPlayback/GraphicEQ.swift \
            Sources/ParsoAudioPlayback/Normalization.swift \
            Tests/PortableSwift/LinuxPortableSmoke.swift \
            -o /tmp/parso-linux-swift-smoke
          /tmp/parso-linux-swift-smoke

  build-native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository scripts and whitespace
        run: |
          bash -n scripts/setup-linux.sh
          git diff --check
      - name: Build native CMake targets
        run: |
          cmake -S . -B build-native -DPARSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel
      - name: Test native CMake targets
        run: ctest --test-dir build-native --output-on-failure
      - name: Install and test Python binding in a fresh virtual environment
        run: |
          python3 -m venv /tmp/parso-python-venv
          /tmp/parso-python-venv/bin/python -m pip install --disable-pip-version-check "setuptools>=68"
          /tmp/parso-python-venv/bin/python -m pip install --no-deps --no-build-isolation ./bindings/python
          PARSO_AUDIO_LIBRARY="$PWD/build-native/libparso.so" \
            /tmp/parso-python-venv/bin/python -m unittest discover \
            -s bindings/python/tests -v
          PARSO_AUDIO_LIBRARY="$PWD/build-native/libparso.so" \
            /tmp/parso-python-venv/bin/python bindings/python/examples/render_acceptance.py \
            --output-dir /tmp/parso-python-acceptance --seconds 30
      - name: Install Windows GNU cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ninja-build mingw-w64
      - name: Cross-build Windows GNU shared library
        run: |
          cmake -S . -B build-windows-cross -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/windows-mingw-x86_64.cmake \
            -DPARSO_BUILD_TESTS=ON \
            -DPARSO_BUILD_SHARED_API=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-windows-cross --parallel
          test -f build-windows-cross/libparso.dll || test -f build-windows-cross/parso.dll
          file build-windows-cross/libparso.dll 2>/dev/null || file build-windows-cross/parso.dll
          test -f build-windows-cross/parso_public_c_consumer.exe
          test -f build-windows-cross/parso_public_cpp_consumer.exe
      - name: Set up .NET for Windows-targeted C# compilation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build C# binding on Linux
        run: dotnet build Bindings/ParsoAudioSharp/ParsoAudioSharp.csproj --configuration Release --warnaserror
      - name: Cross-compile C# native consumer on Linux
        run: dotnet build Bindings/ParsoAudioSharp.Consumer/ParsoAudioSharp.Consumer.csproj --configuration Release --warnaserror

  build-android-ndk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            machine: AArch64
          - abi: x86_64
            machine: Advanced Micro Devices X86-64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java for Android tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
      - name: Configure Android shared library
        env:
          ANDROID_NDK_VERSION: '27.2.12479018'
        run: |
          ndk_root="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cmake -S . -B "build-android-${{ matrix.abi }}" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk_root/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK="$ndk_root" \
            -DPARSO_BUILD_TESTS=OFF \
            -DPARSO_BUILD_SHARED_API=ON \
            -DPARSO_BUILD_CODEC_BRIDGES=ON \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build Android shared library
        run: cmake --build "build-android-${{ matrix.abi }}" --parallel
      - name: Check Android ABI exports
        run: |
          test -f "build-android-${{ matrix.abi }}/libparso.so"
          python3 scripts/check-native-abi.py \
            --library "build-android-${{ matrix.abi }}/libparso.so" \
            --expect-class ELF64 \
            --expect-machine "${{ matrix.machine }}" \
            --output "android-abi-${{ matrix.abi }}.json"
          python3 scripts/check-elf-page-size.py \
            --library "build-android-${{ matrix.abi }}/libparso.so"

  build-android-aar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java for Android and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android packaging toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            'platforms;android-35' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release AAR
        run: |
          gradle --project-dir Bindings/ParsoAudioAndroid \
            -PparsoNdkVersion=27.2.12479018 \
            -PparsoCmakeVersion=3.22.1 \
            testReleaseUnitTest assembleRelease assembleDebugAndroidTest \
            publishReleasePublicationToLocalStagingRepository
      - name: Inspect AAR contents
        run: |
          aar='Bindings/ParsoAudioAndroid/build/outputs/aar/parso-audio-android-release.aar'
          test -f "$aar"
          unzip -l "$aar" | tee aar-contents.txt
          page_dir="$(mktemp -d)"
          page_args=()
          for abi in arm64-v8a x86_64; do
            if [ "$abi" = arm64-v8a ]; then
              machine='AArch64'
              label='arm64'
            else
              machine='Advanced Micro Devices X86-64'
              label='x86_64'
            fi
            for library in libc++_shared.so liboboe.so libparso.so libparso_android.so; do
              entry="jni/$abi/$library"
              unzip -l "$aar" | grep -F " $entry"
              extracted="$page_dir/${label}-${library}"
              unzip -p "$aar" "$entry" > "$extracted"
              page_args+=(--library "$extracted")
            done
            python3 scripts/check-native-abi.py \
              --library "$page_dir/${label}-libparso_android.so" \
              --expect-class ELF64 \
              --expect-machine "$machine" \
              --symbol Java_com_parsoaudio_ParsoNative_nativeCreate \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDestroy \
              --symbol Java_com_parsoaudio_ParsoNative_nativeSetDeckBuffer \
              --symbol Java_com_parsoaudio_ParsoNative_nativePlay \
              --symbol Java_com_parsoaudio_ParsoNative_nativePause \
              --symbol Java_com_parsoaudio_ParsoNative_nativeSetMix \
              --symbol Java_com_parsoaudio_ParsoNative_nativePostCommand \
              --symbol Java_com_parsoaudio_ParsoNative_nativeGetStats \
              --symbol Java_com_parsoaudio_ParsoNative_nativePollEvents \
              --symbol Java_com_parsoaudio_ParsoNative_nativeEncodeRecording \
              --symbol Java_com_parsoaudio_ParsoNative_nativeRender \
              --symbol Java_com_parsoaudio_ParsoNative_nativeRecordSetActive \
              --symbol Java_com_parsoaudio_ParsoNative_nativeRecordDrain \
              --symbol Java_com_parsoaudio_ParsoNative_nativeRecordDroppedFrames \
              --symbol Java_com_parsoaudio_ParsoNative_nativeRecordReset \
              --symbol Java_com_parsoaudio_ParsoNative_nativeAnalysisSummary \
              --symbol Java_com_parsoaudio_ParsoNative_nativeKey \
              --symbol Java_com_parsoaudio_ParsoNative_nativeStructure \
              --symbol Java_com_parsoaudio_ParsoNative_nativeEncodeOggVorbis \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDecodeOggVorbis \
              --symbol Java_com_parsoaudio_ParsoNative_nativeConvertSampleRate \
              --symbol Java_com_parsoaudio_ParsoNative_nativeMeasureLoudness \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDeviceCreate \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDeviceDestroy \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDeviceStart \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDeviceStop \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDeviceState \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDeviceReadCapture \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDeviceAvailableCapture \
              --symbol Java_com_parsoaudio_ParsoNative_nativeDeviceDroppedCapture \
              --output "android-abi-${label}-jni.json"
          done
          python3 scripts/check-elf-page-size.py "${page_args[@]}"
          unzip -p "$aar" AndroidManifest.xml | grep -F 'android.permission.RECORD_AUDIO'
          test -f 'Bindings/ParsoAudioAndroid/build/maven-repository/com/parsoaudio/parso-audio-android/0.1.0/parso-audio-android-0.1.0.pom'
          test -f 'Bindings/ParsoAudioAndroid/build/maven-repository/com/parsoaudio/parso-audio-android/0.1.0/parso-audio-android-0.1.0.aar'
      - name: Build external Android AAR consumer
        run: |
          gradle --project-dir Bindings/ParsoAudioAndroidConsumer --refresh-dependencies assembleDebug
          apk='Bindings/ParsoAudioAndroidConsumer/build/outputs/apk/debug/parso-audio-android-consumer-debug.apk'
          test -f "$apk"
          for abi in arm64-v8a x86_64; do
            for library in libc++_shared.so liboboe.so libparso.so libparso_android.so; do
              unzip -l "$apk" | grep -F " lib/$abi/$library"
            done
          done
      - name: Run Android instrumentation on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            gradle --no-daemon --project-dir Bindings/ParsoAudioAndroid \
              -PparsoNdkVersion=27.2.12479018 \
              -PparsoCmakeVersion=3.22.1 \
              connectedDebugAndroidTest
            gradle --no-daemon --project-dir Bindings/ParsoAudioAndroidConsumer \
              connectedDebugAndroidTest
            consumer_apk='Bindings/ParsoAudioAndroidConsumer/build/outputs/apk/debug/parso-audio-android-consumer-debug.apk'
            adb install -r "$consumer_apk"
            adb shell am force-stop com.parsoaudio.consumer
            adb shell am start -W -n com.parsoaudio.consumer/.MainActivity | tee launcher-start.txt
            grep -F 'Status: ok' launcher-start.txt
            adb shell dumpsys activity activities | grep -F 'com.parsoaudio.consumer/.MainActivity'
            found=0
            for attempt in $(seq 1 10); do
              if adb shell uiautomator dump /sdcard/parso-window.xml >/dev/null 2>&1 && \
                 adb exec-out cat /sdcard/parso-window.xml | grep -F 'encoded='; then
                found=1
                break
              fi
              sleep 1
            done
            test "$found" -eq 1

  build-native-windows:
    # The job uses the Visual Studio 17 2022 generator. Pin the matching
    # image because windows-latest now resolves to the Visual Studio 2026
    # image, which no longer provides that generator.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure native CMake targets
        shell: pwsh
        run: |
          cmake -S . -B build-native `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DPARSO_BUILD_TESTS=ON `
            -DPARSO_BUILD_SHARED_API=ON
      - name: Build native CMake targets
        run: cmake --build build-native --config Release --parallel
      - name: Test native CMake targets
        run: ctest --test-dir build-native -C Release --output-on-failure
      - name: Probe Windows WASAPI render and capture seams
        shell: pwsh
        run: |
          $wasapiHost = Join-Path $pwd 'build-native\Release\parso_windows_wasapi_host.exe'
          if (-not (Test-Path $wasapiHost)) { throw "WASAPI host was not built: $wasapiHost" }
          foreach ($arguments in @(@('1', '--allow-unavailable'), @('1', '--capture', '--allow-unavailable'))) {
            & $wasapiHost @arguments
            $code = $LASTEXITCODE
            if ($code -ne 0 -and $code -ne 77) {
              throw "WASAPI probe failed with exit code ${code}: $($arguments -join ' ')"
            }
            Write-Host "WASAPI probe exit code ${code}: $($arguments -join ' ')"
          }
      - name: Set up .NET for native C# consumer
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build C# native consumer
        run: |
          dotnet build Bindings/ParsoAudioSharp/ParsoAudioSharp.csproj --configuration Release --warnaserror
          dotnet build Bindings/ParsoAudioSharp.Consumer/ParsoAudioSharp.Consumer.csproj --configuration Release --warnaserror
      - name: Run C# native consumer
        shell: pwsh
        run: |
          $env:PATH = "$pwd\build-native\Release;$env:PATH"
          dotnet run --project Bindings/ParsoAudioSharp.Consumer/ParsoAudioSharp.Consumer.csproj --configuration Release --no-build

  build-watchos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select latest installed Xcode
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode*.app; do
            if [[ -d "$candidate" ]]; then xcode_app="$candidate"; fi
          done
          if [[ -n "$xcode_app" ]]; then sudo xcode-select -s "$xcode_app"; fi
          xcodebuild -version
      - name: Build for watchOS Simulator
        run: |
          xcodebuild -scheme parso-audio-engine-Package \
            -destination 'generic/platform=watchOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -skipPackagePluginValidation build

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select latest installed Xcode
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode*.app; do
            if [[ -d "$candidate" ]]; then xcode_app="$candidate"; fi
          done
          if [[ -n "$xcode_app" ]]; then sudo xcode-select -s "$xcode_app"; fi
          xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild -scheme parso-audio-engine-Package \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -skipPackagePluginValidation build
      - name: Cache acceptance-tool build
        uses: actions/cache@v4
        with:
          path: Tools/AcceptanceArtifacts/.build
          key: spm-accept-${{ runner.os }}-${{ hashFiles('Tools/AcceptanceArtifacts/**') }}
          restore-keys: spm-accept-${{ runner.os }}-
      - name: Build the acceptance tool
        run: swift build --package-path Tools/AcceptanceArtifacts
